<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YourSurprise | Product</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/catalog.css">
</head>
<body>
    <div class="topbar">Made personal, made with love <span>|</span> Free delivery from €50</div>
    <header><nav>
        <a class="brand" href="/"><span class="mark"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18"/><path d="M12 8H8.5A2.5 2.5 0 1 1 11 5.5C11 7 12 8 12 8zm0 0h3.5A2.5 2.5 0 1 0 13 5.5C13 7 12 8 12 8z"/></svg></span>YourSurprise</a>
        <div class="nav-actions"><a href="/">Home</a><a href="/products">Browse gifts</a><a href="/#cart">My cart</a></div>
    </nav></header>
    <main><div class="wrap"><a class="product-link" href="/products">← Back to gifts</a><div id="product" class="panel" style="margin-top:20px">Loading product...</div></div></main>
    <footer><div class="footer-inner"><strong class="font-rounded">YourSurprise</strong><span>For all life's special moments.</span></div></footer>
    <script>
        const euro = value => new Intl.NumberFormat('en-GB',{style:'currency',currency:'EUR'}).format(Number(value));
        const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        async function api(path) { const response=await fetch('/api'+path,{headers:{Accept:'application/json'}}); const text=await response.text(); let body; try { body=text?JSON.parse(text):{}; } catch { throw new Error('The API returned an invalid response.'); } if(!response.ok) throw new Error(body.message||`Request failed (${response.status})`); return body; }
        const id=window.location.pathname.split('/').filter(Boolean).pop();
        api(`/products/${encodeURIComponent(id)}`).then(({data:product})=>{ document.title=`${product.title} | YourSurprise`; document.getElementById('product').innerHTML=`<article class="detail"><div class="detail-image"><img src="${esc(product.image)}" alt="${esc(product.title)}"></div><div><p class="eyebrow">${esc(product.brand||product.category?.name||'Gift')}</p><h1 class="font-rounded">${esc(product.title)}</h1><p class="muted">${esc(product.category?.name||'Uncategorised')}</p><div class="detail-price"><span>${euro(product.discounted_price)}</span>${product.discount_percentage>0?`<s class="discount">${euro(product.price)}</s>`:''}</div><p class="detail-copy">${esc(product.description)}</p><p class="muted"><strong>Stock:</strong> ${product.stock} · <strong>Rating:</strong> ${product.rating}</p><p class="muted"><strong>Shipping:</strong> ${esc(product.shippingInformation||'Not specified')}<br><strong>Returns:</strong> ${esc(product.returnPolicy||'Not specified')}<br><strong>Warranty:</strong> ${esc(product.warrantyInformation||'Not specified')}</p></div></article>`; }).catch(error=>document.getElementById('product').innerHTML=`<div class="error">${esc(error.message)}</div>`);
    </script>
</body>
</html>
